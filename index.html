<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة التحقق الأمني الميداني - MOI RP</title>
    <style>
        body {
            background-color: #0b0f15;
            color: #fff;
            font-family: Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-image: radial-gradient(circle at center, #111a2e 0%, #0b0f15 100%);
        }
        .main-container {
            background: #111622;
            border: 2px solid #1f2d42;
            border-radius: 12px;
            padding: 25px;
            width: 750px;
            display: flex;
            gap: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
        }
        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        h2 {
            margin: 0;
            color: #58a6ff;
            font-size: 20px;
            text-align: center;
            border-bottom: 1px solid #1f2d42;
            padding-bottom: 10px;
        }
        .device-box {
            background: #161b22;
            border: 2px solid #30363d;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 10px;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            text-align: center;
            font-size: 14px;
        }
        .scanner-btn {
            background: #1a2332;
            border: 2px dashed #238636;
            color: #2ea043;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            margin-top: 10px;
        }
        .scanner-btn:hover {
            background: #23863622;
        }
        .right-panel {
            flex: 1;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .result-title {
            color: #58a6ff;
            font-weight: bold;
            margin-bottom: 10px;
            border-bottom: 1px dashed #30363d;
            padding-bottom: 5px;
        }
        .result-data {
            font-size: 14px;
            line-height: 1.8;
            color: #c9d1d9;
        }
        .highlight {
            color: #f85149;
            font-weight: bold;
        }
        .success {
            color: #2ea043;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="main-container">
    <!-- القسم الأيمن: شاشة الجهاز وأداة الإدخال -->
    <div class="left-panel">
        <h2>منصة التحقق الأمني</h2>
        <div class="device-box">
            <p style="margin: 0 0 10px 0; font-size: 13px; color: #8b949e;">[ جهاز التبصيم الميداني ZKTeco ]</p>
            <input type="text" id="suspectInput" placeholder="أدخل اسم المشتبه به...">
            <div class="scanner-btn" onclick="scanFingerprint()">
                👆 ضع الإصبع هنا للتبصيم
            </div>
        </div>
    </div>

    <!-- القسم الأيسر: لوحة النتائج الأمنية اللي تطلع مباشرة -->
    <div class="right-panel" id="resultPanel">
        <div class="result-title">نتائج التحقق الفوري</div>
        <div class="result-data" id="resultContent">
            <span style="color: #8b949e;">بانتظار إجراء عملية التبصيم...</span>
        </div>
    </div>
</div>

<script>
function scanFingerprint() {
    const name = document.getElementById('suspectInput').value.trim();
    const resultBox = document.getElementById('resultContent');

    if(!name) {
        resultBox.innerHTML = `<span class="highlight">خطأ: يجب تحديد اسم الشخص قبل مسح البصمة!</span>`;
        return;
    }

    resultBox.innerHTML = `<span style="color: #d29922;">جاري مطابقة بصمة "${name}" مع السجلات الأمنية...</span>`;

    setTimeout(() => {
        resultBox.innerHTML = `
            - الاسم: <span class="success">${name}</span><br>
            - حساب روبلوكس: <span style="color: #58a6ff;">@${name}_RP</span><br>
            - ديسكورد: <span style="color: #58a6ff;">${name}#7001</span><br>
            - المركبة المسجلة: Chevrolet Caprice LS<br>
            - الحالة الأمنية: <span class="highlight">مطلوب أمنياً - السرعة وهروب 🚨</span>
        `;
    }, 1200);
}
</script>

</body>
</html>
